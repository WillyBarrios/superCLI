name: Release superCLI (Windows & Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_name: windows-x86_64
            bin_name: supercli.exe
            archive: zip
          - runner: ubuntu-latest
            os_name: linux-x86_64
            bin_name: supercli
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libgtk-3-dev

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target\release\supercli.exe" "staging\"
          Copy-Item "README.md" "staging\"
          Compress-Archive -Path "staging\*" -DestinationPath "supercli-$tag-${{ matrix.os_name }}.zip" -Force

      - name: Package Linux tar.gz
        if: matrix.archive == 'tar.gz'
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p staging
          cp target/release/supercli staging/
          cp README.md staging/
          tar -czf "supercli-${TAG}-${{ matrix.os_name }}.tar.gz" -C staging .

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            supercli-*.zip
            supercli-*.tar.gz
